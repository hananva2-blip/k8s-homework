name: Kubernetes CI & Security Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # בדיקת תקינות ו-Best Practices עם KubeLinter (RedHat/StackRox)
      - name: KubeLinter Scan
        uses: stackrox/kube-linter-action@v1
        with:
          directory: '.'

      # סריקת אבטחה מתקדמת עם Trivy
      - name: Security Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'